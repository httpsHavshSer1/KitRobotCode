[platformio]
default_envs = motor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@1.2.1
    madhephaestus/ESP32Encoder@5.0.0
    sparkfun/SparkFun LSM6DS3 Breakout@1.0.3

[env:control_board]
build_src_filter = +<RobotControlBoardTest.cpp>

[env:encoder]
build_src_filter = +<RobotEncoderTest.cpp>

[env:imu_native]
build_src_filter = +<RobotImuNativeTest.cpp>

[env:imu_library]
build_src_filter = +<RobotIMUTest.cpp>

[env:motor]
build_src_filter = +<RobotMotorTest.cpp>
lib_deps =
    https://github.com/AlfredoSystems/PestoLink-Receive.git#bdef7bf367c1ea1a0f9c1649d55f2cb5259ad924
    arduino-libraries/ArduinoBLE@^1.4.1
